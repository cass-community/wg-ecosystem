# Build and deploy to GitHub Pages (served at cass.community/wg-ecosystem).
# If bin/prebuild fails (cass.community unreachable, WG entry incomplete,
# validation error), the job fails and the last good deploy stays live.
name: Deploy site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Rebuild daily so events flip from upcoming to past and upstream metadata
  # changes are picked up. Just after midnight AOE, as on cass.community.
  schedule:
    - cron: '1 12 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - uses: actions/configure-pages@v6
        id: pages
      - name: Fetch upstream metadata and generate data files
        run: bin/prebuild
      - name: Build with Jekyll
        run: bundle exec jekyll build --config _config.yml,site.config.yml
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
