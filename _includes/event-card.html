{%- assign e = include.event -%}
<a class="event-card" href="{{ e.url }}">
  <span class="event-card__badge event-card__badge--{{ e.type }}">{{ e.type_label }}</span>
  <span class="event-card__title">{{ e.title }}</span>
  <span class="event-card__date">{{ e.date_display }}</span>
  {%- include event-people.html people=e.people -%}
  <span class="event-card__desc">{{ e.description }}</span>
</a>
